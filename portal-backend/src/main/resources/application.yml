spring:
  application:
    name: ai-interview-portal-backend

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8302}

server:
  port: 8301
  servlet:
    context-path: /
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.ai.interview: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
