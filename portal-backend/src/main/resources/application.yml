spring:
  application:
    name: ai-interview-portal-backend

  datasource:
    url: jdbc:h2:file:./data/interviewdb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notifications:
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

portal:
  frontend-url: ${PORTAL_URL:http://localhost:3000}

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8302}

recording:
  storage-dir: ${RECORDING_STORAGE_DIR:./data/recordings}

server:
  port: 8301
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.ai.interview: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
